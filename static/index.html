<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Talent Search Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Keep marked.js polyfill -->
  <script>
    window.marked = {
      parse: function(t) { return String(t).replace(/\n/g,'<br>'); }
    };
  </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
  <div class="fixed top-0 left-0 w-full h-full -z-10 bg-gradient-to-br from-slate-100 via-white to-slate-50"></div>
  
  <div class="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col min-h-screen">
    
    <header class="mb-12 text-center">
      <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-indigo-600 mb-4 tracking-tight">
        Targeted Casting Search
      </h1>
      <p class="text-slate-500 text-lg max-w-2xl mx-auto">Semantic intelligence meets multi-factor ranking. Specify physical attributes and exact roles to find your perfect talent match.</p>
    </header>

    <main class="flex-grow flex flex-col items-center w-full">
      <div class="w-full max-w-4xl relative mb-10 group">
        <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
          <svg class="h-6 w-6 text-slate-400 group-focus-within:text-indigo-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <input type="text" id="searchInput" 
               class="block w-full pl-14 pr-36 py-5 border border-slate-200 rounded-2xl text-xl shadow-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-shadow outline-none text-slate-700 placeholder-slate-400"
               placeholder="e.g. muscular villain, stand-up comedian..." />
        <button id="searchBtn" 
                class="absolute inset-y-2 right-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl px-8 font-semibold shadow hover:shadow-lg hover:to-indigo-500 transition-all transform hover:-translate-y-0.5 outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Search
        </button>
      </div>

      <div class="w-full mt-4">
        <!-- Status & Loading -->
        <div id="loadingIndicator" class="hidden text-center py-20">
          <div class="animate-pulse flex flex-col items-center">
            <div class="h-14 w-14 bg-indigo-100 rounded-full flex items-center justify-center mb-4">
               <svg class="w-8 h-8 text-indigo-500 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </div>
            <p class="text-indigo-600 font-semibold text-lg">Scanning profiles using multi-factor AI...</p>
          </div>
        </div>

        <div id="welcomeMessage" class="text-center py-20 text-slate-400">
           <svg class="mx-auto h-16 w-16 mb-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
           </svg>
           <h2 class="text-2xl font-bold text-slate-600">Discover Exceptional Talent</h2>
           <p class="mt-2 text-slate-500">Search with specific target roles, crafts, and physical attributes.</p>
        </div>

        <!-- Results Grid -->
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
        </div>
      </div>
    </main>
  </div>
  
  <script src="/static/app.js"></script>
</body>
</html>
